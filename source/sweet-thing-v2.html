<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patissière — Mint Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Quicksand:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ── Reset ─────────────────────────────────────────────────────────────────── */
html, body { margin: 0; padding: 0; background: #E8F0E4; }
body        { font-family: 'Work Sans', system-ui, sans-serif; }
*           { box-sizing: border-box; }
button      { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; outline: none; }

/* ── Переменные ────────────────────────────────────────────────────────────── */
:root {
  --bg:      #E8F0E4;
  --bg2:     #F4F8EF;
  --cream:   #F8F1DC;
  --pink:    #F2D4D2;
  --mint:    #B8D4B0;
  --text:    #1F2A20;
  --muted:   #5F6E5A;
  --line:    rgba(31,42,32,0.14);
  --forest:  #2D4A3A;
  --f-disp:  'Italiana', 'Times New Roman', serif;
  --f-sans:  'Work Sans', system-ui, sans-serif;
  --f-price: 'Quicksand', system-ui, sans-serif;
}

/* ── Обёртка ───────────────────────────────────────────────────────────────── */
.site { background: var(--bg); color: var(--text); font-family: var(--f-sans); max-width: 1440px; margin: 0 auto; width: 100%; }

/* ── Цены (Quicksand) ──────────────────────────────────────────────────────── */
.price-num        { font-family: var(--f-price); font-weight: 700; color: var(--forest); line-height: 1; }
.price-product    { font-size: 52px; }
.price-product-eu { font-size: 26px; }
.price-cart-item  { font-size: 20px; margin-left: auto; }
.price-cart-total { font-size: 44px; }

/* ── Реальные фото (общий класс) ────────────────────────────────────────────── */
.fc__photo        { position: absolute; inset: 0; width: 100%; height: 100%;
                    object-fit: cover; display: block; }
.hero-photo-wrap  { position: relative; overflow: hidden; width: 100%; height: 100%; }
.hero-photo-wrap img { position: absolute; inset: 0; width: 100%; height: 100%;
                    object-fit: cover; object-position: center; display: block; }
.hero-img--tart-slice { object-position: center 62% !important; }
.hero-img--choux      { object-fit: cover !important; object-position: center; transform: scale(1.18); }

/* ── Photo slot ────────────────────────────────────────────────────────────── */
.photo-slot       { width: 100%; height: 100%; position: relative; overflow: hidden;
                    display: flex; align-items: center; justify-content: center;
                    background: var(--slot-bg, #EFE8DD); }
.photo-slot__svg  { position: absolute; inset: 0; }
.photo-slot__lbl  { position: relative; font-size: 11px; letter-spacing: .15em;
                    text-transform: uppercase; text-align: center; padding: 0 12px; line-height: 1.6;
                    color: var(--slot-fg, #6B5E48); }

/* ── Хедер ─────────────────────────────────────────────────────────────────── */
.header           { padding: 24px 64px; display: flex; flex-wrap: wrap; align-items: center;
                    gap: 40px; background: var(--bg); }
.header__logo     { font-family: var(--f-disp); font-size: 32px; color: var(--forest);
                    line-height: 1; letter-spacing: .02em; flex-shrink: 0; }
.header__nav      { flex: 1; display: flex; justify-content: center; gap: 48px; }
.header__nav-a    { font-size: 18px; font-weight: 500; letter-spacing: .01em; color: var(--text);
                    text-decoration: none; cursor: pointer; padding-bottom: 3px;
                    border-bottom: 1px solid transparent; transition: border-color .2s; white-space: nowrap; }
.header__nav-a:hover { border-bottom-color: var(--forest); }
.header__right    { display: flex; gap: 20px; align-items: center; flex-shrink: 0; }
.header__langs    { display: flex; gap: 2px; align-items: center; }
.header__lang-dot { color: var(--muted); font-size: 14px; margin: 0 2px; }
.header__lang-btn { background: none; border: none; padding: 4px 8px; color: var(--muted);
                    text-transform: uppercase; font-weight: 400; font-size: 15px; letter-spacing: .1em; }
.header__lang-btn--on { color: var(--forest); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
.header__cart     { position: relative; display: flex; align-items: center; gap: 10px;
                    padding: 12px 22px; background: var(--cream); border: 1px solid var(--line);
                    color: var(--text); font-size: 15px; font-weight: 500; letter-spacing: .04em; }
.header__cart-badge { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px;
                    background: var(--forest); color: var(--cream); border-radius: 999px;
                    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
@media (max-width: 767px) {
  .header           { padding: 16px 20px; gap: 16px; }
  .header__logo     { font-size: 24px; }
  .header__nav      { order: 3; width: 100%; flex: none; justify-content: flex-start;
                      gap: 20px; overflow-x: auto; padding-bottom: 4px; }
  .header__nav-a    { font-size: 14px; }
}

/* ── Герой ─────────────────────────────────────────────────────────────────── */
.hero             { padding: 20px 64px 100px; background: var(--bg); }
.hero__top        { display: grid; grid-template-columns: 1fr .85fr; gap: 48px; margin-bottom: 32px; }
.hero__h1         { font-family: var(--f-disp); font-size: 132px; font-weight: 400;
                    line-height: .92; color: var(--text); margin: 0; letter-spacing: 0; }
.hero__intro      { align-self: end; padding-bottom: 16px; }
.hero__line       { width: 60px; height: 1px; background: var(--text); margin-bottom: 20px; }
.hero__desc       { font-size: 16px; color: var(--text); line-height: 1.65; margin: 0; }
.hero__cta        { display: flex; gap: 8px; margin-top: 28px; align-items: center; }
.hero__dash       { font-family: var(--f-disp); font-size: 32px; color: var(--forest); font-style: italic; }
.hero__cta-btn    { padding: 14px 30px; background: var(--forest); color: var(--cream); border: none;
                    font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.hero__photos     { display: grid; grid-template-columns: 1.2fr .8fr 1fr; gap: 16px; height: 460px; }
.hero__main       { position: relative; }
.hero__lbl        { position: absolute; left: 20px; bottom: 20px; background: var(--cream);
                    padding: 10px 16px; font-family: var(--f-disp); font-style: italic;
                    font-size: 18px; color: var(--forest); }
.hero__mid        { display: grid; grid-template-rows: 1fr 1fr; gap: 16px; }
.hero__count      { background: var(--forest); color: var(--cream); padding: 24px;
                    display: flex; flex-direction: column; justify-content: space-between; }
.hero__count-tag  { font-family: var(--f-disp); font-size: 14px; font-style: italic; letter-spacing: .1em; }
.hero__count-num  { font-family: var(--f-disp); font-size: 44px; line-height: .95; margin-top: 12px; }
.hero__count-unit { font-size: 16px; font-family: var(--f-sans); letter-spacing: .18em; text-transform: uppercase; }
.hero__side       {}
@media (max-width: 1023px) {
  .hero__h1     { font-size: 80px; }
  .hero__photos { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 767px) {
  .hero         { padding: 24px 20px 60px; }
  .hero__top    { grid-template-columns: 1fr; gap: 24px; margin-bottom: 24px; }
  .hero__h1     { font-size: 52px; }
  .hero__desc   { font-size: 14px; }
  .hero__photos { grid-template-columns: 1fr; height: auto; }
  .hero__side   { height: 220px; }
}

/* ── Карточка вкуса ─────────────────────────────────────────────────────────── */
.fc               { display: block; width: 100%; padding: 0; background: transparent; border: none;
                    color: var(--text); text-align: left; transition: opacity .2s; }
.fc--dis          { opacity: .45; cursor: default; }
.fc__thumb        { position: relative; aspect-ratio: 1/1; margin-bottom: 14px;
                    background: var(--card-bg, #EFE8DD); overflow: hidden; }
.fc__num          { position: absolute; top: 12px; left: 12px; font-family: var(--f-sans);
                    font-size: 10px; font-weight: 600; letter-spacing: .18em; color: var(--forest);
                    background: var(--bg2); padding: 5px 9px; text-transform: uppercase; }
.fc__sel-ring     { position: absolute; inset: 0; border: 2px solid var(--forest);
                    display: flex; align-items: center; justify-content: center; }
.fc__check        { width: 48px; height: 48px; border-radius: 999px; background: var(--forest);
                    color: var(--cream); display: flex; align-items: center; justify-content: center; }
.fc__title        { font-family: var(--f-disp); font-size: 26px; line-height: 1.1; margin-bottom: 6px; }
.fc__detail       { font-size: 13px; color: var(--muted); line-height: 1.55; }
.fc__tags         { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.fc__tag          { font-size: 11px; font-weight: 500; color: var(--forest);
                    padding: 3px 9px; background: var(--bg2); letter-spacing: .04em; }

/* ── Продукт / Карусель ─────────────────────────────────────────────────────── */
.product          { background: var(--bg); padding: 100px 64px; }
.product__head    { display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
                    margin-bottom: 64px; align-items: end; }
.product__chapter { font-size: 12px; font-weight: 600; letter-spacing: .22em;
                    text-transform: uppercase; color: var(--forest); margin-bottom: 24px; }
.product__title   { font-family: var(--f-disp); font-size: 96px; font-weight: 400;
                    line-height: .95; color: var(--text); margin: 0; }
.product__desc    { font-size: 16px; color: var(--text); line-height: 1.7; margin: 0; max-width: 480px; }
.product__box     { border: 1px solid var(--line); }
.product__bhead   { display: flex; justify-content: space-between; align-items: center;
                    padding: 20px 32px; border-bottom: 1px solid var(--line); }
.product__btitle  { font-family: var(--f-disp); font-style: italic; font-size: 24px; color: var(--forest); }
.product__nav     { display: flex; gap: 10px; align-items: center; }
.product__nbtn    { width: 44px; height: 44px; border: 1px solid var(--line);
                    background: transparent; color: var(--forest); font-family: var(--f-disp);
                    font-size: 22px; display: flex; align-items: center; justify-content: center; }
.product__nbtn--next { border-color: var(--forest); background: var(--forest); color: var(--cream); }
.carousel-wrap    { padding: 32px 14px 24px; }
.carousel-ov      { overflow: hidden; }
.carousel-track   { display: flex; }
.carousel-slot    { flex-shrink: 0; padding: 0 14px; }
/* Панель заказа */
.order-panel      { background: var(--cream); border-top: 1px solid var(--line);
                    padding: 40px 48px; display: grid;
                    grid-template-columns: auto 1fr auto; gap: 40px; align-items: center; }
.order-controls   { display: flex; gap: 28px; flex-wrap: wrap; }
.order-grp-lbl    { font-size: 11px; font-weight: 600; letter-spacing: .18em;
                    text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.order-size-btns  { display: flex; gap: 6px; }
.order-size-btn   { width: 48px; height: 48px; border: 1px solid var(--line);
                    background: transparent; color: var(--text);
                    font-family: var(--f-price); font-size: 20px; font-weight: 600; }
.order-size-btn--on { border-color: var(--forest); background: var(--forest); color: var(--cream); }
.order-mode-btns  { display: flex; border: 1px solid var(--line); }
.order-mode-btn   { padding: 14px 22px; border: none; background: transparent;
                    color: var(--text); font-size: 13px; font-weight: 500; }
.order-mode-btn--on { background: var(--forest); color: var(--cream); }
.order-qty-wrap   { display: flex; border: 1px solid var(--line); align-items: center; height: 48px; }
.order-qty-btn    { width: 40px; height: 100%; background: none; border: none;
                    color: var(--muted); font-size: 20px; }
.order-qty-num    { width: 36px; text-align: center; font-family: var(--f-price);
                    font-size: 22px; font-weight: 600; color: var(--text); }
.order-status     { font-size: 13px; color: var(--muted); line-height: 1.6;
                    justify-self: center; max-width: 200px; text-align: center; }
.order-price-area { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.order-add-btn    { padding: 14px 32px; background: transparent; color: var(--muted);
                    border: 1px solid var(--forest); font-size: 12px; font-weight: 600;
                    letter-spacing: .12em; text-transform: uppercase; cursor: default; }
.order-add-btn--on { background: var(--forest); color: var(--cream); cursor: pointer; }
@media (max-width: 1023px) {
  .product__title { font-size: 72px; }
}
@media (max-width: 767px) {
  .product      { padding: 60px 20px; }
  .product__head { grid-template-columns: 1fr; gap: 16px; margin-bottom: 32px; }
  .product__title { font-size: 52px; }
  .order-panel  { grid-template-columns: 1fr; gap: 20px; padding: 24px 20px; }
  .order-status { justify-self: start; }
  .order-price-area { align-items: flex-start; }
}

/* ── Редакционный блок ──────────────────────────────────────────────────────── */
.ed             { background: var(--forest); color: var(--cream); padding: 120px 64px; }
.ed__grid       { display: grid; grid-template-columns: .9fr 1.2fr; gap: 80px; align-items: center; }
.ed__eyebrow    { font-size: 12px; font-weight: 600; letter-spacing: .22em;
                  text-transform: uppercase; opacity: .7; margin-bottom: 24px; }
.ed__title      { font-family: var(--f-disp); font-size: 80px; font-weight: 400;
                  line-height: .95; margin: 0; color: var(--cream); }
.ed__quote      { font-family: var(--f-disp); font-style: italic; font-size: 28px;
                  line-height: 1.45; margin: 0; opacity: .95; }
.ed__attr       { margin-top: 32px; font-size: 13px; letter-spacing: .18em;
                  text-transform: uppercase; opacity: .7; }
@media (max-width: 1023px) {
  .ed__title  { font-size: 64px; }
  .ed__quote  { font-size: 22px; }
}
@media (max-width: 767px) {
  .ed         { padding: 64px 20px; }
  .ed__grid   { grid-template-columns: 1fr; gap: 32px; }
  .ed__title  { font-size: 48px; }
  .ed__quote  { font-size: 20px; }
}

/* ── Отзывы ─────────────────────────────────────────────────────────────────── */
.reviews        { background: var(--bg); padding: 56px 64px 120px; }
.reviews__head  { display: flex; justify-content: space-between; align-items: flex-end;
                  margin-bottom: 56px; gap: 16px; flex-wrap: wrap; }
.reviews__eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .22em;
                  text-transform: uppercase; color: var(--forest); margin-bottom: 20px; }
.reviews__title { font-family: var(--f-disp); font-size: 80px; font-weight: 400;
                  line-height: .95; color: var(--text); margin: 0; }
.reviews__loc   { font-family: var(--f-disp); font-style: italic; font-size: 20px;
                  color: var(--muted); padding-bottom: 8px; }
.reviews__grid  { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; }
.rcard          { padding: 48px 40px; display: flex; flex-direction: column;
                  justify-content: space-between; min-height: 340px; background: var(--cream); }
.rcard--dark    { background: var(--forest); }
.rcard__mark    { font-family: var(--f-disp); font-size: 72px; color: var(--forest);
                  line-height: .7; margin-bottom: 20px; opacity: .25; }
.rcard--dark .rcard__mark { color: var(--cream); }
.rcard__text    { font-family: var(--f-disp); font-style: italic; font-size: 20px;
                  line-height: 1.6; color: var(--text); margin: 0; }
.rcard--dark .rcard__text { color: var(--cream); }
.rcard__foot    { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
.rcard--dark .rcard__foot { border-top-color: rgba(248,241,220,.2); }
.rcard__name    { font-size: 14px; font-weight: 600; color: var(--text); }
.rcard--dark .rcard__name { color: var(--cream); }
.rcard__detail  { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .04em; }
.rcard--dark .rcard__detail { color: rgba(248,241,220,.55); }
@media (max-width: 1023px) {
  .reviews__title { font-size: 64px; }
  .reviews__grid  { grid-template-columns: 1fr 1fr; }
  .reviews__loc   { display: none; }
}
@media (max-width: 767px) {
  .reviews        { padding: 48px 20px 64px; }
  .reviews__head  { margin-bottom: 32px; }
  .reviews__title { font-size: 48px; }
  .reviews__grid  { grid-template-columns: 1fr; gap: 12px; }
  .rcard          { padding: 32px 24px; min-height: auto; }
  .rcard__text    { font-size: 17px; }
}

/* ── Кейтеринг ──────────────────────────────────────────────────────────────── */
.catering       { background: var(--forest); color: var(--cream); padding: 120px 64px; }
.catering__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.catering__title { font-family: var(--f-disp); font-size: 96px; font-weight: 400;
                   line-height: .95; color: var(--cream); margin: 0; }
.catering__desc  { font-size: 17px; color: var(--cream); line-height: 1.75;
                   margin: 0 0 40px; opacity: .88; }
.catering__btn   { padding: 16px 36px; background: transparent;
                   border: 1px solid var(--cream); color: var(--cream);
                   font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
@media (max-width: 1023px) {
  .catering__title { font-size: 72px; }
  .catering__desc  { font-size: 15px; }
}
@media (max-width: 767px) {
  .catering        { padding: 64px 20px; }
  .catering__grid  { grid-template-columns: 1fr; gap: 32px; }
  .catering__title { font-size: 60px; }
}

/* ── Футер ──────────────────────────────────────────────────────────────────── */
.footer         { background: var(--bg2); padding: 80px 64px 32px; }
.footer__grid   { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr;
                  gap: 48px; margin-bottom: 56px; }
.footer__logo   { font-family: var(--f-disp); font-size: 48px; color: var(--forest); line-height: 1; }
.footer__desc   { font-size: 14px; color: var(--muted); line-height: 1.7; margin-top: 20px; max-width: 300px; }
.footer__col-h  { font-size: 11px; font-weight: 600; letter-spacing: .18em;
                  text-transform: uppercase; color: var(--forest); margin-bottom: 16px; }
.footer__col-i  { font-size: 14px; color: var(--text); line-height: 1.9; }
.footer__bot    { padding-top: 24px; border-top: 1px solid var(--line);
                  display: flex; flex-wrap: wrap; justify-content: space-between;
                  gap: 8px; font-size: 12px; color: var(--muted); }
.footer__tag    { font-family: var(--f-disp); font-style: italic; font-size: 16px; color: var(--forest); }
@media (max-width: 1023px) {
  .footer__grid { grid-template-columns: 1fr 1fr 1fr; }
}
@media (max-width: 767px) {
  .footer       { padding: 48px 20px 24px; }
  .footer__grid { grid-template-columns: 1fr 1fr; gap: 24px 16px; }
  .footer__logo-col { grid-column: 1 / -1; }
  .footer__logo { font-size: 36px; }
  .footer__desc { margin-top: 16px; }
}

/* ── Корзина ────────────────────────────────────────────────────────────────── */
.cart-overlay   { position: fixed; inset: 0; z-index: 200; display: flex; }
.cart-back      { flex: 1; background: rgba(31,42,32,.38); }
.cart-panel     { width: 420px; background: var(--bg2); display: flex;
                  flex-direction: column; box-shadow: -6px 0 32px rgba(31,42,32,.18); }
.cart-hd        { padding: 24px 28px; border-bottom: 1px solid var(--line);
                  display: flex; justify-content: space-between; align-items: center;
                  background: var(--cream); flex-shrink: 0; }
.cart-hd__title { font-family: var(--f-disp); font-size: 28px; color: var(--forest); }
.cart-hd__close { background: none; border: none; color: var(--muted); font-size: 20px; line-height: 1; }
.cart-body      { flex: 1; overflow-y: auto; padding: 20px 22px; }
.cart-empty     { text-align: center; padding-top: 80px; }
.cart-empty__ic { font-family: var(--f-disp); font-style: italic; font-size: 40px;
                  color: var(--muted); margin-bottom: 12px; }
.cart-empty__tx { font-size: 14px; color: var(--muted); }
.cart-ft        { padding: 22px 28px; border-top: 1px solid var(--line);
                  background: var(--cream); flex-shrink: 0; }
.cart-total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
.cart-total-lbl { font-size: 11px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .18em; color: var(--muted); }
.cart-checkout-btn { width: 100%; padding: 16px; background: var(--forest); color: var(--cream);
                  border: none; font-size: 12px; font-weight: 600;
                  letter-spacing: .14em; text-transform: uppercase; }
.cart-group     { margin-bottom: 16px; }
.cart-section-label { font-size: 13px; font-weight: 700; letter-spacing: .18em;
                  text-transform: uppercase; color: var(--forest); margin-bottom: 14px; padding-left: 2px; }
.cart-item      { background: var(--bg2); border: 1px solid var(--line);
                  padding: 16px 18px; margin-bottom: 10px; }
.cart-flavor-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.cart-flavor-name { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.3; }
.cart-flavor-pcs  { font-size: 12px; color: var(--muted); }
.cart-item-footer { display: flex; align-items: center; gap: 10px;
                  margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.cart-qty-wrap  { display: inline-flex; border: 1px solid var(--line); align-items: center; }
.cart-qty-btn   { width: 30px; height: 30px; background: none; border: none; color: var(--text); font-size: 16px; }
.cart-qty-num   { width: 24px; text-align: center; font-family: var(--f-price);
                  font-size: 18px; font-weight: 600; color: var(--text); }
.cart-qty-label { flex: 1; font-size: 12px; color: var(--muted); }
.cart-remove-btn { background: none; border: none; color: var(--muted); font-size: 16px; padding: 4px 0 4px 8px; line-height: 1; }

/* ── MiniThumb ──────────────────────────────────────────────────────────────── */

function pluralizeBox(n, lang) {
  if (lang === "pt") return n === 1 ? "caixa" : "caixas";
  const m10 = n % 10, m100 = n % 100;
  if (m100 >= 11 && m100 <= 19) return "коробок";
  if (m10 === 1) return "коробка";
  if (m10 >= 2 && m10 <= 4) return "коробки";
  return "коробок";
}

function useBreakpoint() {
  const [w, setW] = React.useState(window.innerWidth);
  React.useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return { isMobile: w < 768, isTablet: w < 1024 };
}

function V2_Product({ lang, kind, onAdd, sectionId }) {
  const T = (r, p) => lang === "ru" ? r : p;
  const { isMobile, isTablet } = useBreakpoint();
  const isT = kind === "tartlet";
  const [mode, setMode] = React.useState("one");
  const [size, setSize] = React.useState(isT ? 4 : 2);
  const [flavors, setFlavors] = React.useState([]);
  const [qty, setQty] = React.useState(1);
  const gridMode = isT ? mode : (size === 4 ? mode : "one");
  const maxFlavors = gridMode === "two" ? 2 : 1;
  const price = isT ? PRICES.tart : ({ 2:PRICES.e2, 3:PRICES.e3, 4:PRICES.e4 }[size]);
  const ready = flavors.length === maxFlavors;
  const toggle = (id) => setFlavors(prev =>
    prev.includes(id) ? prev.filter(x => x !== id) : (prev.length < maxFlavors ? [...prev, id] : prev));
  const reset = () => { setFlavors([]); setQty(1); };

  const list = isT ? TARTLET_FLAVORS : ECLAIR_FLAVORS;
  const perView = isMobile ? 1 : isTablet ? 2 : 4;
  const stripCount = perView + 2;
  const trackW = ((stripCount / perView) * 100) + "%";
  const restPct = (-(100 / stripCount)) + "%";
  const nextPct = (-(200 / stripCount)) + "%";

  const [startIdx, setStartIdx] = React.useState(0);
  const trackRef = React.useRef(null);
  const lockRef = React.useRef(false);

  const [toastMsg, setToastMsg] = React.useState("");
  const [toastOn, setToastOn] = React.useState(false);
  const toastTimer = React.useRef(null);
  const showToast = (msg) => {
    setToastMsg(msg);
    setToastOn(true);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastOn(false), 3000);
  };

  const stripItems = Array.from({ length: stripCount }, (_, i) => {
    const ri = ((startIdx - 1 + i) % list.length + list.length) % list.length;
    return { item: list[ri], realIdx: ri };
  });

  React.useLayoutEffect(() => {
    if (trackRef.current) {
      trackRef.current.style.transition = "none";
      trackRef.current.style.transform = "translateX(" + restPct + ")";
    }
  }, [startIdx, perView]);

  React.useEffect(() => { setStartIdx(0); }, [list, perView]);

  const slide = (dir) => {
    if (lockRef.current || !trackRef.current) return;
    lockRef.current = true;
    const t = trackRef.current;
    t.style.transition = "transform 0.5s cubic-bezier(0.65,0,0.35,1)";
    t.style.transform = dir === 1 ? "translateX(" + nextPct + ")" : "translateX(0%)";
    setTimeout(() => {
      setStartIdx(prev => ((prev + dir) % list.length + list.length) % list.length);
      requestAnimationFrame(() => { lockRef.current = false; });
    }, 520);
  };

  return (
    <section id={sectionId} className="product">
      <div className="product__head">
        <div>
          <div className="product__chapter">
            ❋ {isT ? T("Глава первая","Capítulo um") : T("Глава вторая","Capítulo dois")}
          </div>
          <h2 className="product__title">
            {isT ? T("Тарталетки","Tarteletes") : T("Эклеры","Eclairs")}
          </h2>
        </div>
        <div>
          <p className="product__desc">
            {isT
              ? T("Хрустящая основа из песочного теста, заварной крем, свежие сезонные фрукты. Набор из четырёх — один или два вкуса, как вам нравится.",
                  "Base crocante de massa areada, creme pasteleiro, frutos da época. Conjunto de quatro — um ou dois sabores, à sua escolha.")
              : T("Заварное тесто и кремовые начинки. От пары на двоих до коробки из четырёх — выбирайте размер и комбинируйте вкусы.",
                  "Massa choux e recheios cremosos. Do par para dois à caixa de quatro — escolha o tamanho e combine sabores.")}
          </p>
        </div>
      </div>

      <div className="product__box">
        <div className="product__bhead">
          <div className="product__btitle">
            {T(list.length + " композиций на выбор", list.length + " composições à escolha")}
          </div>
          <div className="product__nav">
            <button className="product__nbtn" onClick={() => slide(-1)}>←</button>
            <button className="product__nbtn product__nbtn--next" onClick={() => slide(1)}>→</button>
          </div>
        </div>
        <div className="carousel-wrap">
          <div className="carousel-ov">
            <div ref={trackRef} className="carousel-track" style={{ width: trackW, transform: "translateX(" + restPct + ")" }}>
              {stripItems.map(({ item: fl, realIdx }, i) => (
                <div key={fl.id + "-" + i} className="carousel-slot" style={{ width: "calc(100% / " + stripCount + ")" }}>
                  <V2_FlavorCard fl={fl} lang={lang} idx={realIdx}
                    selected={flavors.includes(fl.id)}
                    disabled={flavors.length >= maxFlavors}
                    onClick={() => toggle(fl.id)} />
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="order-panel">
          <div className="order-controls">
            {!isT && (
              <div>
                <div className="order-grp-lbl">{T("Размер","Tamanho")}</div>
                <div className="order-size-btns">
                  {[2,3,4].map(s => (
                    <button key={s}
                      className={"order-size-btn" + (size === s ? " order-size-btn--on" : "")}
                      onClick={() => { setSize(s); reset(); if (s < 4) setMode("one"); }}>{s}</button>
                  ))}
                </div>
              </div>
            )}
            {(isT || size === 4) && (
              <div>
                <div className="order-grp-lbl">{T("Состав","Composição")}</div>
                <div className="order-mode-btns">
                  {[["one", T("1 вкус","1 sabor")], ["two", T("2 вкуса","2 sabores")]].map(([v, l]) => (
                    <button key={v}
                      className={"order-mode-btn" + (mode === v ? " order-mode-btn--on" : "")}
                      onClick={() => { setMode(v); reset(); }}>{l}</button>
                  ))}
                </div>
              </div>
            )}
            <div>
              <div className="order-grp-lbl">{T("Количество","Quantidade")}</div>
              <div className="order-qty-wrap">
                <button className="order-qty-btn" onClick={() => setQty(Math.max(1, qty - 1))}>−</button>
                <span className="order-qty-num">{qty}</span>
                <button className="order-qty-btn" onClick={() => setQty(qty + 1)}>+</button>
              </div>
            </div>
          </div>

          <div className="order-status">
            {ready ? T("✓ Готово к добавлению в корзину","✓ Pronto a adicionar") : T("Выберите вкус выше","Escolha um sabor acima")}
          </div>

          <div className="order-price-area">
            <div className="price-num price-product">
              {price * qty}<span className="price-product-eu"> €</span>
            </div>
            <button
              className={"order-add-btn" + (ready ? " order-add-btn--on" : "")}
              onClick={() => {
                if (ready) {
                  onAdd({ kind, flavors:[...flavors], size: isT ? 4 : size, qty, price });
                  reset();
                } else {
                  const need = maxFlavors - flavors.length;
                  const msg = lang === "ru"
                    ? (flavors.length === 0
                        ? "Выберите " + maxFlavors + (maxFlavors === 1 ? " вкус" : " вкуса")
                        : "Ещё " + need + (need === 1 ? " вкус" : " вкуса") + " — выберите выше")
                    : (flavors.length === 0
                        ? "Escolha " + maxFlavors + " sabor" + (maxFlavors > 1 ? "es" : "")
                        : "Mais " + need + " sabor" + (need > 1 ? "es" : "") + " — escolha acima");
                  showToast(msg);
                }
              }}>
              {T("Положить в корзину","Adicionar ao cesto")}
            </button>
          </div>
        </div>
      </div>
      <div className={"toast" + (toastOn ? " toast--show" : "")}>{toastMsg}</div>
    </section>
  );
}

  };
  const MONTH_SHORT = {
    ru:["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"],
    pt:["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"],
  };
  const TIME_SLOTS = ["10:00–12:00","12:00–14:00","14:00–16:00","16:00–18:00"];

  const isDisabled = (d) => {
    if (!d) return true;
    const a = new Date(d); a.setHours(0,0,0,0);
    const b = new Date(minDate); b.setHours(0,0,0,0);
    return a < b;
  };
  const isSame = (a, b) => a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

  const buildCells = () => {
    const firstDow = (new Date(calYear, calMonth, 1).getDay() + 6) % 7;
    const dim = new Date(calYear, calMonth + 1, 0).getDate();
    const cells = Array(firstDow).fill(null);
    for (let d = 1; d <= dim; d++) cells.push(new Date(calYear, calMonth, d));
    return cells;
  };

  const prevMonth = () => { if (calMonth === 0) { setCalYear(y => y - 1); setCalMonth(11); } else setCalMonth(m => m - 1); };
  const nextMonth = () => { if (calMonth === 11) { setCalYear(y => y + 1); setCalMonth(0); } else setCalMonth(m => m + 1); };

  const handleDay = (d) => {
    if (isDisabled(d)) return;
    setCalPickedDate(d);
    setForm(p => ({ ...p, date: d.toISOString().slice(0,10), timeSlot:"" }));
  };
  const handleSlot = (slot) => {
    setForm(p => ({ ...p, timeSlot: slot }));
    setTimeout(() => setCalOpen(false), 180);
  };
  const formatSelected = () => {
    if (!form.date) return null;
    const d = new Date(form.date + "T00:00:00");
    const dow = DAY_HDR[lang][(d.getDay() + 6) % 7];
    return dow + ", " + d.getDate() + " " + MONTH_SHORT[lang][d.getMonth()] + (form.timeSlot ? " · " + form.timeSlot : "");
  };

  const cells = buildCells();

  return (
    <div className="co-overlay">
      <div className="co-back" onClick={() => { if (!sent) onClose(); }} />
      <div className="co-modal">
        {sent ? (
          <div className="co-ok">
            <div className="co-ok__ring">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2D4A3A" strokeWidth="2" strokeLinecap="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div className="co-ok__title">{T("Заказ принят!","Pedido recebido!")}</div>
            {form.date && form.timeSlot && (
              <div className="co-ok__date">
                <span className="co-ok__date-tx">📅 {formatSelected()}</span>
              </div>
            )}
            <p className="co-ok__msg">{T("Мы свяжемся с вами для подтверждения.","Entraremos em contacto para confirmar.")}</p>
            <button className="co-ok__btn" onClick={onDone}>{T("Готово","Fechar")}</button>
          </div>
        ) : (
          <>
            <div className="co-hd">
              <div className="co-title">{T("Оформление","Finalizar")}</div>
              <button className="co-close" onClick={onClose}>✕</button>
            </div>

            <div className="co-summary">
              {cart.map(item => {
                const kindLabel = item.kind === "tartlet"
                  ? T("Тарталетки · 4 шт","Tarteletes · 4 un")
                  : T("Эклеры","Eclairs") + " · " + item.size + " " + T("шт","un");
                const fl = item.flavors.map(id => { const f = flavorObj(item.kind, id); return f ? f[lang] : id; }).join(" + ");
                return (
                  <div key={item.id} className="co-sum-row">
                    <div>
                      <div className="co-sum-kind">{kindLabel} ×{item.qty}</div>
                      <div className="co-sum-flavor">{fl}</div>
                    </div>
                    <div className="co-sum-price">{item.price * item.qty} €</div>
                  </div>
                );
              })}
              <div className="co-sum-total-row">
                <span className="co-sum-total-lbl">{T("Итого","Total")}</span>
                <span className="co-sum-total-p">{total} €</span>
              </div>
            </div>

            <div className="co-field">
              <label className="co-label">{T("Имя *","Nome *")}</label>
              <input className="co-input" type="text" value={form.name}
                onChange={e => setForm(p => ({ ...p, name: e.target.value }))}
                placeholder={T("Ваше имя","O seu nome")} />
            </div>

            <div className="co-field">
              <label className="co-label">{T("Контакт *","Contacto *")}</label>
              <div className="co-methods">
                {[["whatsapp","WhatsApp"],["telegram","Telegram"],["phone",T("Телефон","Telefone")],["email","Email"]].map(([m,l]) => (
                  <button key={m}
                    className={"co-method-btn" + (form.contactMethod === m ? " co-method-btn--on" : "")}
                    onClick={() => setForm(p => ({ ...p, contactMethod:m, contactValue:"" }))}>{l}</button>
                ))}
              </div>
              <input className="co-input"
                type={form.contactMethod === "email" ? "email" : "tel"}
                value={form.contactValue}
                onChange={e => setForm(p => ({ ...p, contactValue: e.target.value }))}
                placeholder={{ whatsapp:"+351 999 000 000", telegram:"@username", phone:"+351 999 000 000", email:"hello@email.com" }[form.contactMethod]} />
            </div>

            <div className="co-field">
              <label className="co-label">{T("Дата и время *","Data e hora *")}</label>
              <button
                className={"co-date-btn" + (form.date ? " co-date-btn--set" : " co-date-btn--unset")}
                onClick={() => setCalOpen(o => !o)}>
                <span>{formatSelected() || T("Выберите дату и время","Escolha data e hora")}</span>
                <span className={"co-date-arr" + (calOpen ? " co-date-arr--open" : "")}>▾</span>
              </button>
              {calOpen && (
                <div className="co-cal">
                  <div className="co-cal-nav">
                    <button className="co-cal-btn" onClick={prevMonth}>←</button>
                    <span className="co-cal-month">{MONTH_FULL[lang][calMonth]} {calYear}</span>
                    <button className="co-cal-btn" onClick={nextMonth}>→</button>
                  </div>
                  <div className="co-cal-grid">
                    {DAY_HDR[lang].map(d => <div key={d} className="co-cal-dname">{d}</div>)}
                  </div>
                  <div className="co-cal-grid">
                    {cells.map((d, i) => {
                      if (!d) return <div key={"e"+i} />;
                      const dis = isDisabled(d);
                      const sel = calPickedDate && isSame(d, calPickedDate);
                      return (
                        <button key={i} disabled={dis} onClick={() => handleDay(d)}
                          className={"co-cal-day" + (dis ? " co-cal-day--dis" : "") + (sel ? " co-cal-day--sel" : "")}>
                          {d.getDate()}
                        </button>
                      );
                    })}
                  </div>
                  {calPickedDate && (
                    <div className="co-slots">
                      <div className="co-slots-lbl">{T("Выберите время","Escolha o horário")}</div>
                      <div className="co-slot-grid">
                        {TIME_SLOTS.map(slot => (
                          <button key={slot}
                            className={"co-slot-btn" + (form.timeSlot === slot ? " co-slot-btn--on" : "")}
                            onClick={() => handleSlot(slot)}>{slot}</button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="co-dlv-section">
              <label className="co-label">{T("Получение","Recebimento")}</label>
              <div className="co-dlv-btns">
                {[["pickup",T("Самовывоз","Levantar")],["delivery",T("Доставка (Uber/Bolt)","Entrega (Uber/Bolt)")]].map(([v,l]) => (
                  <button key={v}
                    className={"co-dlv-btn" + (form.delivery === v ? " co-dlv-btn--on" : "")}
                    onClick={() => setForm(p => ({ ...p, delivery:v, address:"" }))}>{l}</button>
                ))}
              </div>
            </div>

            {form.delivery === "pickup" && (
              <div className="co-info co-info--pickup">
                <span className="co-info-ic">📍</span>
                <div className="co-info-tx co-info-tx--p">
                  {lang === "ru"
                    ? <span>Самовывоз осуществляется по адресу:<br/><strong>м. Parque de Real · Rua Florbela Espanca</strong></span>
                    : <span>Levantamento no endereço:<br/><strong>M. Parque de Real · Rua Florbela Espanca</strong></span>}
                </div>
              </div>
            )}

            {form.delivery === "delivery" && (
              <>
                <div className="co-info co-info--delivery">
                  <span className="co-info-ic">🚗</span>
                  <div className="co-info-tx co-info-tx--d">
                    {T("Доставка осуществляется через Uber или Bolt. Точная стоимость будет известна в момент отправки — мы согласуем её с вами перед отправкой заказа.",
                       "Entrega via Uber ou Bolt. O custo exacto será confirmado no momento do envio — iremos acordar consigo antes de despachar.")}
                  </div>
                </div>
                <div className="co-field">
                  <label className="co-label">{T("Адрес доставки *","Morada de entrega *")}</label>
                  <input className="co-input" type="text" value={form.address}
                    onChange={e => setForm(p => ({ ...p, address: e.target.value }))}
                    placeholder={T("Улица, дом, квартира","Rua, número, andar")} />
                </div>
              </>
            )}

            <div className="co-field co-field--lg">
              <label className="co-label">{T("Комментарий","Observações")}</label>
              <textarea rows={3} className="co-input" style={{ resize:"vertical" }}
                value={form.note}
                onChange={e => setForm(p => ({ ...p, note: e.target.value }))}
                placeholder={T("Пожелания к заказу...","Observações ao pedido...")} />
            </div>

            <button
              className={"co-submit" + (canSubmit ? " co-submit--on" : " co-submit--off")}
              disabled={!canSubmit}
              onClick={() => { if (canSubmit) setSent(true); }}>
              {T("Отправить заказ →","Enviar pedido →")}
            </button>
            {!canSubmit && <p className="co-hint">{T("Заполните все обязательные поля","Preencha todos os campos obrigatórios")}</p>}
          </>
        )}
      </div>
    </div>
  );
}

// ── Приложение ────────────────────────────────────────────────────────────────

function SiteV2() {
  const [lang, setLang] = React.useState("ru");
  const [cart, setCart] = React.useState([]);
  const [cartOpen, setCartOpen] = React.useState(false);
  const [checkoutOpen, setCheckoutOpen] = React.useState(false);

  const onAdd = (item) => { setCart(c => [...c, { ...item, id: Date.now() }]); setCartOpen(true); };
  const changeQty = (id, delta) => setCart(c => c.map(i => i.id === id ? { ...i, qty: Math.max(1, i.qty + delta) } : i));
  const removeItem = (id) => setCart(c => c.filter(i => i.id !== id));
  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);

  return (
    <div className="site">
      <V2_Header lang={lang} setLang={setLang} count={count} onCartOpen={() => setCartOpen(true)} />
      <V2_Hero lang={lang} />
      <V2_Product lang={lang} kind="tartlet" onAdd={onAdd} sectionId="tartlets" />
      <V2_Editorial lang={lang} />
      <V2_Product lang={lang} kind="eclair" onAdd={onAdd} sectionId="eclairs" />
      <V2_Gallery lang={lang} />
      <V2_Reviews lang={lang} />
      <V2_Catering lang={lang} />
      <V2_Footer lang={lang} />

      <button className="cart-fab" onClick={() => setCartOpen(true)}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/>
        </svg>
        {count > 0 && <span className="cart-fab__badge">{count}</span>}
      </button>

      {cartOpen && (
        <V2_CartDrawer lang={lang} cart={cart} total={total}
          onQtyChange={changeQty} onRemove={removeItem}
          onClose={() => setCartOpen(false)}
          onCheckout={() => { setCartOpen(false); setCheckoutOpen(true); }} />
      )}
      {checkoutOpen && (
        <V2_Checkout lang={lang} cart={cart} total={total}
          onClose={() => setCheckoutOpen(false)}
          onDone={() => { setCheckoutOpen(false); setCart([]); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SiteV2 />);
</script>
</body>
</html>
